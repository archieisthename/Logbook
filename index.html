<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logbook">
<meta name="theme-color" content="#0a0d12">
<title>Logbook</title>
<style>
:root{--bg:#0a0d12;--s1:#12171f;--s2:#1a212b;--line:#252d39;--ink:#fff;--mut:#8b95a5;--acc:#3b6cff;--ok:#2fbf71;--warn:#ff6b57;--e:cubic-bezier(.2,.8,.2,1);color-scheme:dark;box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 110px}
main.in>*{animation:vin .45s var(--e) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
h1{font-size:34px;letter-spacing:-.03em;margin:6px 0 2px}h2{font-size:26px;letter-spacing:-.02em;margin:4px 0 14px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0;font-size:17px;letter-spacing:-.01em}.j{color:var(--mut);font-size:12px;margin:2px 0 10px;line-height:1.3}.sg{color:var(--acc);font-size:13px;font-weight:600;margin:2px 0 8px}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;transition:transform .15s var(--e),background .2s,opacity .2s}
button:active{transform:scale(.96)}.pri{background:var(--acc);border-color:var(--acc);width:100%;font-size:18px;padding:17px;box-shadow:0 8px 30px #3b6cff40}.gh{background:none;border:0;color:var(--mut);padding:8px 10px}
.row{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;margin-bottom:8px}.row .nt{grid-column:1/-1;font-size:13px}
input[type=number],input[type=text],textarea{width:100%;padding:12px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #3b6cff33}
.f{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-weight:700;color:var(--mut);cursor:pointer;transition:all .2s var(--e)}.f input{display:none}.f:has(input:checked){background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.06)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:8px}.opt span{color:var(--mut);font-weight:400;font-size:13px}.opt.hi{background:var(--acc);border-color:var(--acc)}.opt.hi span{color:#dbe4ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .opt{flex-direction:column;align-items:flex-start;gap:2px;margin:0}.lb{color:var(--mut);font-size:13px;margin:16px 0 8px}
.ban{background:#ff6b5722;border:1px solid #ff6b5755;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}.w{color:var(--warn);font-size:13px}
nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:#12171fcc;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;z-index:5}
nav button{background:none;border:0;color:var(--mut);padding:10px 13px;border-radius:16px}nav button.on{background:var(--acc);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.tm{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700}
#sh{position:fixed;inset:0;z-index:20;pointer-events:none}#sh.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:#000a;opacity:0;transition:opacity .3s}.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--s1);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .42s var(--e);max-width:520px;margin:0 auto}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}.sheet input{margin-bottom:8px}
textarea{min-height:200px;font:13px/1.4 ui-monospace,Menlo,monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main>
<nav id="nav"><button id="n-home" onclick="go('home')">Home</button><button id="n-hist" onclick="go('hist')">History</button><button id="n-lib" onclick="go('lib')">Exercises</button><button id="n-set" onclick="go('set')">Settings</button></nav>
<div id="sh"></div>
<script>
const K='logbook1',RG=[6,10],BK=[12,20];
const NAMES={ul:'Upper / Lower',ppl:'Push / Pull / Legs'};
const X=(n,a,j=2.5,s=[RG,BK])=>({n,a,j,s});
const I=(n,a,j=1,k=2)=>X(n,a,j,Array(k).fill([8,15]));
const PP='Shoulder horizontal adduction + flexion; elbow extension',SP='Shoulder flexion; elbow extension',DP='Elbow extension; shoulder flexion',PD='Shoulder adduction/extension; elbow flexion',RW='Shoulder extension; scapular retraction; elbow flexion',KE='Knee extension; hip extension';
const UP1=()=>[X('Incline press (machine)',PP),X('High incline Smith press',SP),X('Narrow-grip press / dip machine',DP),I('Cable lateral raise','Shoulder abduction',1,3),X('Neutral-grip pulldown',PD),X('Chest-supported row',RW),I('Cable fly','Shoulder horizontal adduction',2.5),I('Overhead triceps extension','Elbow extension (lengthened)',2.5),I('Incline curl','Elbow flexion (lengthened)',1.25)];
const UP2=()=>[X('Low incline press',PP),X('Smith shoulder press (dead stop)','Shoulder flexion + abduction; elbow extension'),X('Dip machine',DP),I('Machine lateral raise','Shoulder abduction',1,3),X('Pull-up / assisted pull-up','Shoulder adduction; elbow flexion',2.5),X('Single-arm cable row',RW),I('Rear delt fly','Shoulder horizontal abduction',1),I('Triceps pushdown','Elbow extension',2.5),I('Preacher curl','Elbow flexion',1.25)];
const UP3=()=>[X('Incline dumbbell press',PP,2),X('Machine shoulder press',SP),X('Narrow-grip press',DP),I('Cable lateral raise','Shoulder abduction',1,3),X('Wide-grip pulldown','Shoulder adduction; elbow flexion'),X('High machine row',RW),I('Pec deck','Shoulder horizontal adduction',2.5),I('Skull crusher','Elbow extension',1.25),I('Hammer curl','Elbow flexion; neutral forearm',1)];
const LO1=()=>[X('Lying leg curl','Knee flexion'),X('Leg press (dead stop)',KE,5),X('Hack squat',KE,5),X('Leg extension','Knee extension'),X('Seated leg curl (lengthened)','Knee flexion; hip flexed'),X('Split squat (front foot elevated)',KE,2),X('Lying leg raise','Hip flexion; trunk flexion',0)];
const LO2=()=>[X('Seated leg curl','Knee flexion; hip flexed'),X('Pendulum squat',KE,5),X('Leg press (feet high)','Hip extension; knee extension',5),X('Leg extension','Knee extension'),X('Hyperextension','Hip extension',2.5),X('Dumbbell RDL (paused)','Hip extension',2),I('Hip adductor machine','Hip adduction',2.5)];
const LO3=()=>[X('Lying leg curl','Knee flexion'),X('Squat (Smith / barbell)',KE,5),X('Leg press',KE,5),X('Leg extension','Knee extension'),X('Seated leg curl (lengthened)','Knee flexion; hip flexed'),X('Walking lunge',KE,2),X('Lying leg raise','Hip flexion; trunk flexion',0)];
const PRE={ul:()=>({prog:{U1:UP1(),U2:UP2(),U3:UP3(),L1:LO1(),L2:LO2(),L3:LO3()},order:['U1','L1','R','U2','L2','R','U3','L3','R']}),
ppl:()=>({prog:{PUSH:[X('Incline press (machine)',PP),X('High incline Smith press',SP),X('Narrow-grip press / dip machine',DP),I('Pec deck / cable fly','Shoulder horizontal adduction',2.5),I('Cable lateral raise','Shoulder abduction',1,5),I('Dip machine (triceps focus)','Elbow extension',2.5)],PULL:[X('Neutral-grip pulldown',PD),X('Chest-supported row',RW),X('Single-arm cable row',RW),I('Straight-arm pulldown','Shoulder extension',2.5),I('Rear delt fly','Shoulder horizontal abduction',1),I('Incline curl','Elbow flexion (lengthened)',1.25)],LEGS:LO1()},order:['PUSH','PULL','LEGS','R']})};
const init=()=>({...PRE.ul(),idx:0,logs:[],ses:[],dr:{}});

let S;try{S=JSON.parse(localStorage.getItem(K))||init()}catch(e){S=init()}
S.cur=S.cur||null;S.lib=S.lib||{};
function seedLib(){S.lib=S.lib||{};const add=e=>{if(!S.lib[e.n])S.lib[e.n]={n:e.n,a:e.a,j:e.j,s:e.s}};Object.values(S.prog).flat().forEach(add);Object.keys(PRE).forEach(k=>Object.values(PRE[k]().prog).flat().forEach(add));save()}
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let view=S.cur?'wk':'home',sheet=null;
seedLib();
const iso=()=>new Date().toISOString().slice(0,10);
function last(n,i){for(let k=S.logs.length-1;k>=0;k--){const l=S.logs[k];if(l.n==n&&l.sets[i])return l.sets[i]}}
function lastLog(n){for(let k=S.logs.length-1;k>=0;k--)if(S.logs[k].n==n)return S.logs[k]}
function sug(e,i){const p=last(e.n,i),[lo,hi]=e.s[Math.min(i,e.s.length-1)];
 if(!p)return `New. Find a weight for ${lo}-${hi} reps to failure`;
 if(!p.f)return `Repeat ${p.w} kg. Reach clean failure first`;
 if(p.r>=hi)return `Jump to ${+(p.w+e.j).toFixed(2)} kg, aim for ${lo}+`;
 return `${p.w} kg, beat ${p.r}: aim for ${p.r+1}+`}
function nextDay(){for(let i=0;i<S.order.length;i++){const d=S.order[(S.idx+i)%S.order.length];if(d!='R'&&S.prog[d])return d}return Object.keys(S.prog)[0]}
const mmss=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function dr(el){S.cur.dr[el.name]=el.type=='checkbox'?el.checked:el.value;save()}
const v=k=>S.cur.dr[k]??'';
function exCard(e,ei){let h=`<div class="card"><h3>${e.n}</h3><div class="j">${e.a||'No joint action set'}</div>`;
 const ll=lastLog(e.n);if(ll&&ll.pain)h+=`<div class="w" style="margin:-6px 0 8px">Pain flagged last time</div>`;
 e.s.forEach((rg,i)=>{const p=last(e.n,i),k=`${e.n}|${i}|`;
  h+=`<div class="mut">Set ${i+1} · ${rg[0]}-${rg[1]} reps${p?` · last ${p.w}×${p.r}${p.f?' ✓':''}`:''}</div><div class="sg">${sug(e,i)}</div>
  <div class="row"><input type="number" inputmode="decimal" placeholder="kg" name="${k}w" value="${v(k+'w')}" oninput="dr(this)"><input type="number" inputmode="numeric" placeholder="reps" name="${k}r" value="${v(k+'r')}" oninput="dr(this)">
  <label class="f"><input type="checkbox" name="${k}f" ${v(k+'f')?'checked':''} onchange="dr(this)">F</label><input class="nt" type="text" placeholder="machine setting / note" name="${k}s" value="${v(k+'s')}" oninput="dr(this)"></div>`});
 return h+`<label class="mut"><input type="checkbox" name="${e.n}|p" ${v(e.n+'|p')?'checked':''} onchange="dr(this)"> Pain or joint issue</label><div><button class="gh" onclick="addSet(${ei})">+ Set</button><button class="gh" onclick="rm(${ei})">Remove</button></div></div>`}
function banner(){const a=S.ses.slice(-2);return a.length==2&&a.every(s=>s.tot>=3&&s.imp/s.tot<.5)?`<div class="ban">Two sessions in a row with most sets not beating last time. Check sleep, food, stress and joints. If recovery is the issue, cut back-off sets for a bit.</div>`:''}
const V={
home(){const nd=nextDay();let h=`<div><h1>Logbook</h1><div class="mut">${new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}</div></div>${banner()}`;
 if(S.cur)h+=`<div class="card"><div class="mut">In progress</div><h2 style="margin:4px 0 12px">${S.cur.name}</h2><button class="pri" onclick="go('wk')">Resume · <span id="tm2">${mmss(Date.now()-S.cur.start)}</span></button><button class="gh" onclick="discard()">Discard</button></div>`;
 else h+=`<button class="pri" onclick="openSh('new')">Start workout</button><button class="opt card" style="margin-top:12px;padding:14px" onclick="startDay('${nd}')"><b>Up next: ${nd}</b><span>${S.prog[nd].length} exercises · tap to start</span></button>`;
 h+=`<div class="lb">Recent</div>`;
 h+=S.ses.length?S.ses.slice(-5).reverse().map(s=>`<div class="card" style="padding:12px 14px"><b>${s.name||s.day}</b><div class="mut">${s.d}${s.tot?` · ${s.imp}/${s.tot} sets up on last time`:''}</div></div>`).join(''):`<div class="card mut">No workouts yet. Start one above.</div>`;return h},
hist(){return `<h2>History</h2>`+(S.logs.length?S.logs.slice(-40).reverse().map(l=>`<div class="card"><h3>${l.n}</h3><div class="mut">${l.d} · ${l.day}${l.pain?' · <span class="w">pain</span>':''}</div>${l.sets.map((s,i)=>s?`<div>Set ${i+1}: ${s.w} kg × ${s.r}${s.f?' ✓':''}${s.s?` <span class="mut">(${s.s})</span>`:''}</div>`:'').join('')}</div>`).join(''):`<div class="card mut">Nothing logged yet.</div>`)},
lib(){return `<h2>Exercises</h2><input type="text" id="lq" placeholder="Search" oninput="lf()" style="margin-bottom:12px"><div id="ll">${libList('')}</div>`},
set(){return `<h2>Settings</h2><div class="card"><div class="mut">Replace your program with a starter. Logged history is kept.</div><div style="margin-top:10px"><button onclick="lp('ul')">Upper / Lower</button> <button onclick="lp('ppl')">Push / Pull / Legs</button></div></div>
<div class="card"><div class="mut" style="margin-bottom:8px">Backup, restore or edit the program JSON. Rep ranges are [low, high] per set, j is the weight jump.</div><textarea id="tx" spellcheck="false"></textarea><div style="margin-top:8px"><button onclick="tx.value=JSON.stringify(S)">Backup</button> <button onclick="imp()">Restore</button> <button onclick="tx.value=JSON.stringify({prog:S.prog,order:S.order},null,1)">Program</button> <button onclick="sp()">Save program</button> <button onclick="navigator.clipboard&&navigator.clipboard.writeText(tx.value)">Copy</button></div><div id="msg" class="mut"></div></div>`},
wk(){const c=S.cur;return `<div class="top"><button class="gh" onclick="go('home')">‹ Home</button><span class="tm" id="tm">${mmss(Date.now()-c.start)}</span></div><h2>${c.name}</h2>`+(c.ex.length?c.ex.map(exCard).join(''):`<div class="card mut">Empty workout. Add your first exercise.</div>`)+`<button class="opt card" style="padding:14px" onclick="openSh('add')"><b>+ Add exercise</b><span>Your own</span></button><button class="pri" onclick="fin()">Finish workout</button><button class="gh" style="width:100%" onclick="discard()">Discard workout</button>`}};
const SH={
new(){const nd=nextDay();return `<div class="scrim" onclick="closeSh()"></div><div class="sheet"><div class="grab"></div><h2>New workout</h2>
<button class="opt hi" onclick="startDay('${nd}')"><b>Up next: ${nd}</b><span>${S.prog[nd].length} exercises</span></button>
<div class="lb">My program</div><div class="grid">${Object.keys(S.prog).map(d=>`<button class="opt" onclick="startDay('${d}')"><b>${d}</b><span>${S.prog[d].length} exercises</span></button>`).join('')}</div>
${Object.keys(PRE).map(k=>{const p=PRE[k]().prog;return `<div class="lb">${NAMES[k]}</div><div class="grid">${Object.keys(p).map(d=>`<button class="opt" onclick="startPre('${k}','${d}')"><b>${d}</b><span>${p[d].length} exercises</span></button>`).join('')}</div>`}).join('')}
<div class="lb">Or</div><button class="opt" onclick="startW('Custom workout',[],null)"><b>Start fresh</b><span>Build as you go</span></button></div>`},
add(){return `<div class="scrim" onclick="closeSh()"></div><div class="sheet"><div class="grab"></div><h2>Add exercise</h2><input type="text" id="pq" placeholder="Search your exercises" oninput="pf()"><div id="pl">${pickList('')}</div><div class="lb">Or create a new one</div><input type="text" id="ex_n" placeholder="Exercise name"><input type="text" id="ex_a" placeholder="Joint actions, e.g. elbow flexion; shoulder extension (required)"><div class="grid" style="grid-template-columns:repeat(4,1fr)"><input type="number" id="ex_s" placeholder="sets" value="2"><input type="number" id="ex_lo" placeholder="min" value="6"><input type="number" id="ex_hi" placeholder="max" value="12"><input type="number" id="ex_j" placeholder="jump kg" value="2.5"></div><div id="ex_m" class="mut" style="margin:6px 0 12px">Sets, rep range, weight jump at the top of the range.</div><button class="pri" onclick="ae()">Add to workout</button></div>`}};
function render(anim){const m=$('app');m.innerHTML=V[view]();m.className=anim?'in':'';if(anim)[...m.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,8)));
 $('nav').style.display=view=='wk'?'none':'flex';['home','hist','lib','set'].forEach(x=>$('n-'+x).className=view==x?'on':'')}
function go(x){if(x=='wk'&&!S.cur)x='home';view=x;render(1);scrollTo(0,0)}
function openSh(k){sheet=k;$('sh').innerHTML=SH[k]();requestAnimationFrame(()=>requestAnimationFrame(()=>$('sh').classList.add('open')))}
function closeSh(){sheet=null;$('sh').classList.remove('open');setTimeout(()=>{if(!sheet)$('sh').innerHTML=''},450)}
function startW(name,ex,src){S.cur={name,src,ex:JSON.parse(JSON.stringify(ex)),start:Date.now(),dr:{}};save();closeSh();view='wk';render(1);scrollTo(0,0)}
const startDay=d=>startW(d,S.prog[d],d),startPre=(k,d)=>startW(NAMES[k]+' · '+d,PRE[k]().prog[d],null);
function ae(){const n=ex_n.value.replace(/["'<>]/g,'').trim(),a=ex_a.value.replace(/[<>]/g,'').trim();
 if(!n||!a){ex_m.textContent='Name and joint actions are both required.';return}
 if(S.lib[n]){ex_m.textContent='Already in your exercises. Pick it from the list above.';return}
 const lo=+ex_lo.value||6,hi=Math.max(lo,+ex_hi.value||12);
 const e={n,a,j:isNaN(parseFloat(ex_j.value))?2.5:+ex_j.value,s:Array(Math.min(8,Math.max(1,+ex_s.value||2))).fill([lo,hi])};S.lib[n]={...e,custom:true};S.cur.ex.push(e);save();closeSh();render()}
function rm(i){const e=S.cur.ex[i];if(!confirm('Remove '+e.n+' from this workout?'))return;S.cur.ex.splice(i,1);save();render()}
function addSet(i){const e=S.cur.ex[i];e.s.push(e.s[e.s.length-1]);save();render()}
function discard(){if(!confirm('Discard this workout? Nothing will be saved.'))return;S.cur=null;save();view='home';render(1)}
function fin(){const c=S.cur;let imp=0,tot=0,any=0;
 c.ex.forEach(e=>{const sets=e.s.map((_,i)=>{const k=`${e.n}|${i}|`,w=parseFloat(c.dr[k+'w']),r=parseInt(c.dr[k+'r']);
  if(isNaN(w)&&isNaN(r))return null;const o={w:w||0,r:r||0,f:!!c.dr[k+'f'],s:c.dr[k+'s']||''},p=last(e.n,i);
  if(p){tot++;if(o.w>p.w||(o.w==p.w&&o.r>p.r))imp++}return o});
  if(sets.some(x=>x)){any=1;S.logs.push({d:iso(),day:c.name,n:e.n,sets,pain:!!c.dr[e.n+'|p']})}});
 if(!any&&!confirm('Nothing logged. Finish anyway?'))return;
 if(any)S.ses.push({d:iso(),day:c.src||'Custom',name:c.name,imp,tot});
 if(c.src&&S.prog[c.src]){S.prog[c.src]=c.ex;for(let i=0;i<S.order.length;i++){const j=(S.idx+i)%S.order.length;if(S.order[j]==c.src){S.idx=j+1;break}}}
 S.cur=null;save();view='home';render(1);scrollTo(0,0)}
function lp(k){if(!confirm('Replace your current program?'))return;Object.assign(S,PRE[k](),{idx:0});save();msg.textContent='Loaded '+NAMES[k]+'.'}
function imp(){try{const o=JSON.parse(tx.value);if(!o.prog||!o.order)throw 0;S=Object.assign(init(),o);seedLib();msg.textContent='Restored.'}catch(e){msg.textContent='That is not valid backup data.'}}
function sp(){try{const o=JSON.parse(tx.value);if(!o.prog||!o.order)throw 0;S.prog=o.prog;S.order=o.order;S.idx=0;seedLib();msg.textContent='Program saved.'}catch(e){msg.textContent='Program JSON is invalid. Nothing was changed.'}}
const topSet=l=>{const t=l.sets.filter(x=>x).sort((a,b)=>b.w-a.w||b.r-a.r)[0];return t?`${t.w} kg × ${t.r}`:''};
function libList(q){q=q.toLowerCase();const ns=Object.keys(S.lib).filter(n=>n.toLowerCase().includes(q)).sort();
 return ns.length?ns.map(n=>{const e=S.lib[n],ls=S.logs.filter(l=>l.n==n);let best='';ls.forEach(l=>l.sets.forEach(x=>{if(x&&(!best||x.w>best.w||(x.w==best.w&&x.r>best.r)))best=x}));
  return `<details class="card"><summary><b>${n}</b>${e.custom?' <span class="mut">· yours</span>':''}<div class="j" style="margin-bottom:0">${e.a||''}</div></summary><div style="margin-top:10px">${ls.length?`<div>Best: ${best.w} kg × ${best.r}</div><div class="mut">${ls.length} session${ls.length>1?'s':''} logged · last ${topSet(ls[ls.length-1])}</div>`+ls.slice(-6).reverse().map(l=>`<div class="mut">${l.d}: ${l.sets.map(x=>x?x.w+'×'+x.r+(x.f?'✓':''):'-').join(', ')}</div>`).join(''):'<div class="mut">No sessions logged yet.</div>'}${e.custom?`<button class="gh" onclick="delEx(decodeURIComponent('${encodeURIComponent(n)}'))">Delete exercise</button>`:''}</div></details>`}).join(''):'<div class="card mut">No matches.</div>'}
const lf=()=>{$('ll').innerHTML=libList($('lq').value)};
function pickList(q){q=q.toLowerCase();const ns=Object.keys(S.lib).filter(n=>n.toLowerCase().includes(q)&&!S.cur.ex.some(e=>e.n==n)).sort().slice(0,25);
 return ns.map(n=>{const l=lastLog(n);return `<button class="opt" onclick="pickAdd(decodeURIComponent('${encodeURIComponent(n)}'))"><b>${n}</b><span>${l?topSet(l):''}</span></button>`}).join('')||'<div class="mut">No matches.</div>'}
const pf=()=>{$('pl').innerHTML=pickList($('pq').value)};
function pickAdd(n){const e=S.lib[n];if(!e)return;S.cur.ex.push(JSON.parse(JSON.stringify({n:e.n,a:e.a,j:e.j,s:e.s})));save();closeSh();render()}
function delEx(n){if(!confirm('Remove '+n+' from your exercises? Logged history is kept.'))return;delete S.lib[n];save();lf()}
setInterval(()=>{if(S.cur){const t=mmss(Date.now()-S.cur.start);['tm','tm2'].forEach(i=>{const el=$(i);if(el)el.textContent=t})}},1000);
render(1);
